#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "fusion"
name = "Fusion"
description.en = "Friendly RSS reader"
description.fr = "Lecteur RSS convivial"

version = "1.3.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
code = "https://github.com/0x2E/fusion"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/0x2E/fusion/releases/download/v1.3.0/fusion_linux_amd64.zip"
    amd64.sha256 = "fb7d100865c5c447cf5f06540b8f4bbfe1ca42945d550b28562dba5a63960dad"
    arm64.url = "https://github.com/0x2E/fusion/releases/download/v1.3.0/fusion_linux_arm64.zip"
    arm64.sha256 = "38f993a55cdb56c294336ad686f939b1779f6417774678b75b45ba9379667973"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.arm64 = "fusion_linux_arm64.zip"
    autoupdate.asset.amd64 = "fusion_linux_amd64.zip"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false
    
    [resources.ports]
